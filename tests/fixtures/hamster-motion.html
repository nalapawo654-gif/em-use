<!doctype html><html lang="zh-CN"><meta charset="utf-8"><base href="/"><title>仓鼠整身动作与猫表情验收</title><style>body{background:#faf5ec;color:#644c33;font:14px system-ui;margin:24px}h1{font-size:22px}section{display:grid;grid-template-columns:repeat(6,180px);gap:12px}figure{margin:0;background:#eee4d1;border-radius:10px;text-align:center}canvas{width:180px;height:180px}figcaption{padding:0 0 10px}button,select{padding:8px;margin:0 12px 15px 0}#live{width:280px;height:280px}</style><h1>一体化日班装扮 · 小步跑动</h1><canvas id="live" width="512" height="512"></canvas><p>帽子、身体、裤子、脚使用同一张完整帧。</p><h1>逐帧 · 开心 / 疲惫</h1><section id="run"></section><h1>全部装扮</h1><section id="skins"></section><h1>监工猫 · 哈欠 / 趴睡 / 偷吃</h1><section id="cat"></section><script type="module">
import {hamsterRig,loadHamsterSkin,catFrames} from '/src/hamster/sprites.ts';import {renderHamster} from '/src/hamster/render.ts';import{renderCat}from'/src/hamster/cat.ts';import {HAMSTER_SKINS} from '/src/shared/types.ts';
await Promise.all(HAMSTER_SKINS.map(s=>loadHamsterSkin(s.id)));const rig=await hamsterRig();function canvas(parent,label){const f=document.createElement('figure'),c=document.createElement('canvas'),cap=document.createElement('figcaption');c.width=c.height=512;cap.textContent=label;f.append(c,cap);document.querySelector(parent).append(f);return c}
for(const level of ['full','working'])for(let i=0;i<6;i++){const c=canvas('#run',`${level==='full'?'开心':'疲惫'} · ${i+1}`);renderHamster(c.getContext('2d'),rig,level,'idle',i*(level==='full'?90:120),true,'worker')}
for(const skin of HAMSTER_SKINS){const c=canvas('#skins',skin.label);renderHamster(c.getContext('2d'),rig,'full','idle',0,false,skin.id)}
const cats=await catFrames();for(let i=0;i<12;i++){const c=canvas('#cat',`${i<4?'哈欠':i<8?'趴睡':'偷吃'} · ${i%4+1}`);c.width=384;c.height=341;renderCat(c.getContext('2d'),cats,i,i<4?'yawn':i<8?'sleep':'snack',0,false)}
const live=document.querySelector('#live');function draw(t){renderHamster(live.getContext('2d'),rig,'full','idle',t,true,'worker');requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script></html>
