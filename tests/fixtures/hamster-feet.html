<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<base href="/">
<link rel="icon" href="data:,">
<title>仓鼠后脚逐帧检查</title>
<style>
body{font:14px system-ui;background:#f8f5ef;color:#554936;margin:24px}h1{font-size:22px}h2{font-size:17px}button,select{font:inherit;padding:6px;margin-right:12px}.live{display:flex;gap:20px;align-items:end}.sample{position:relative;width:300px;height:300px}.mini{width:190px;height:190px}.hamster-visual,.hamster-visual canvas{width:100%;height:100%}section{display:grid;grid-template-columns:repeat(6,160px);gap:8px}figure{margin:0;background:#eee4d1;text-align:center}figure canvas{width:160px;height:200px}figcaption{padding:8px}header{margin:20px 0}.hamster-asset-error{color:#b00}
</style>
<h1>仓鼠后脚逐帧检查</h1>
<p>实际组件：正常 / 疲惫 / 加速 / 暂停。下方列出七套装扮全部 84 张运行帧。</p>
<div id="app"></div>
<div id="frames"></div>
<script type="module">
import {createApp,h,ref} from '/node_modules/.vite/deps/vue.js';
import HamsterVisual from '/src/components/HamsterVisual.vue';
import {loadHamsterSkin} from '/src/hamster/sprites.ts';
import {HAMSTER_SKINS} from '/src/shared/types.ts';
createApp({setup(){
 const skin=ref('worker'),level=ref('working'),action=ref('idle'),reduced=ref(false);
 const select=(label,value,options)=>h('label',[label+' ',h('select',{'aria-label':label,value:value.value,onChange:e=>value.value=e.target.value},options.map(([id,text])=>h('option',{value:id},text)))]);
 return ()=>h('div',[
  h('header',[
   select('装扮',skin,HAMSTER_SKINS.map(s=>[s.id,s.label])),select('状态',level,[['full','正常'],['working','疲惫']]),select('动作',action,[['idle','日常'],['wheel','加速跑轮'],['feed','喂食']]),
   h('label',[h('input',{type:'checkbox',checked:reduced.value,onChange:e=>reduced.value=e.target.checked}),'轻柔模式'])
  ]),
  h('div',{class:'live'},['sample','sample mini'].map(className=>h('div',{class:className},[h(HamsterVisual,{skin:skin.value,level:level.value,action:action.value,reducedMotion:reduced.value})])))
 ]);
}}).mount('#app');
for(const skin of HAMSTER_SKINS){
 const rig=await loadHamsterSkin(skin.id),heading=document.createElement('h2'),section=document.createElement('section');heading.textContent=skin.label;section.dataset.skin=skin.id;document.querySelector('#frames').append(heading,section);
 for(let i=0;i<12;i++){
  const figure=document.createElement('figure'),canvas=document.createElement('canvas'),caption=document.createElement('figcaption');canvas.width=256;canvas.height=320;
  canvas.getContext('2d').drawImage(rig.skins[skin.id][i],0,192,256,320,0,0,256,320);
  caption.textContent=`${i<6?'开心':'疲惫'} ${i%6+1}${i%6===1||i%6===3?' · 已修正':''}`;figure.append(canvas,caption);section.append(figure);
 }
}
document.body.dataset.ready='true';
</script>
</html>
