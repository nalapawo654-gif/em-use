name: Build Rust desktop apps
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rust-desktop-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}
defaults:
  run:
    working-directory: rust-desktop
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: rust-desktop/package-lock.json
      - run: npm ci
      - run: node scripts/version.mjs --check
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
      - run: npm run verify:parity
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install Pillow==11.3.0
      - run: npm run verify:assets
      - run: npm test
      - run: npm run build
      - run: git diff --exit-code -- src-tauri/src/settings-contract.json src-tauri/src/behavior-contract.json
  package:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_BUILD: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: rust-desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-desktop/src-tauri -> target
      - run: npm ci
      - run: npm run contract
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Configure platform release (Windows requires persistent updater keys)
        run: node scripts/ci-config.mjs ${{ matrix.target }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
      - name: Package native installer
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config src-tauri/ci.conf.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Verify macOS app and DMG signatures
        if: runner.os == 'macOS'
        run: bash scripts/verify-macos-bundle.sh 'src-tauri/target/${{ matrix.target }}/release/bundle'
      - run: node scripts/collect-artifacts.mjs ${{ matrix.target }} src-tauri/target/${{ matrix.target }}/release/bundle installers
      - uses: actions/upload-artifact@v4
        with:
          name: EM-Use-${{ matrix.target }}
          path: rust-desktop/installers/
          if-no-files-found: error
          retention-days: 30
  static-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: EM-Use-*
          merge-multiple: true
          path: rust-desktop/artifacts
      - name: Assemble static server directory
        run: |
          node scripts/release-site.mjs artifacts release-site "${RELEASE_TAG#v}"
          cd release-site
          zip -r "../EM-Use-${RELEASE_TAG}-static-site.zip" index.html em-use UPLOAD-README.txt
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: EM-Use-${{ github.ref_name }}-static-server
          path: rust-desktop/EM-Use-*-static-site.zip
          if-no-files-found: error
          retention-days: 90
