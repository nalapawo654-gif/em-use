<!doctype html><html lang="zh-CN"><meta charset="utf-8"><base href="/"><link rel="icon" href="data:,"><title>肥嘟嘟九帧 / 六配色</title><style>body{background:#f8f3e8;color:#57402c;margin:20px;font:14px system-ui}section{display:grid;grid-template-columns:repeat(9,130px);gap:8px}figure{position:relative;margin:0;aspect-ratio:1;border:1px solid #dacbae}figcaption{position:absolute;bottom:2px;text-align:center;width:100%;font-size:10px}h1{font-size:20px}.dark{background:#2d2924;color:#f5e5c9;padding:15px}</style><h1>肥嘟嘟：全部九帧 × 六种配色，真实运行素材</h1><div id="app"></div><script type="module">
import {createApp,h} from '/node_modules/.vite/deps/vue.js'
import FeiduduVisual from '/src/components/FeiduduVisual.vue'
import '/src/feidudu.css'
import {FEIDUDU_SKINS} from '/src/shared/types.ts'
const labels=['元气','奶茶','抱枕','趴下','趴平','饼干','加班','肚皮','挥手']
createApp({render(){return h('div',FEIDUDU_SKINS.flatMap(({id:skin,label:name})=>[h('h2',name),h('section',labels.map((label,frame)=>h('figure',[h(FeiduduVisual,{frame,skin,gentle:true}),h('figcaption',label)])))]).concat([h('h2','深色背景边缘'),h('section',{class:'dark'},labels.map((label,frame)=>h('figure',[h(FeiduduVisual,{frame,gentle:true}),h('figcaption',label)])))]))}}).mount('#app')
</script></html>
