<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EM Use · 咚咚来信预览</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f5ed;color:#243e36;font:14px/1.6 'PingFang SC','Microsoft YaHei',sans-serif}header{max-width:1440px;margin:auto;padding:46px 36px 20px}small{font-size:11px;letter-spacing:2px;color:#748578}h1{font-size:34px;font-weight:500;letter-spacing:-1px;margin:12px 0 9px}p{color:#748174;margin:0}.account{display:inline-flex;gap:20px;background:#e9eee1;border:1px solid #dce4d5;border-radius:8px;padding:9px 14px;font-size:12px;margin-top:20px}.account b{font-weight:600;color:#375545}.toolbar{max-width:1440px;margin:auto;padding:16px 36px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.toolbar button,select{border:1px solid #cbd7c7;border-radius:7px;padding:8px 14px;background:#fffffa;color:#375545;font:inherit;cursor:pointer}.toolbar .primary{background:#315e4a;color:white;border-color:#315e4a}.toolbar span{margin-left:auto;color:#889082;font-size:11px}main{max-width:1440px;margin:auto;padding:12px 36px 40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(570px,1fr));gap:18px}article{border:1px solid #dce2d3;border-radius:14px;background:#fffefa;overflow:hidden}.caption{display:flex;justify-content:space-between;align-items:center;padding:13px 18px;border-bottom:1px solid #e8ecdf}.caption b{font-size:13px;font-weight:500}.caption a{font-size:11px;color:#849181;text-decoration:none}.stage{height:340px;display:flex;justify-content:center;align-items:center;overflow:hidden;background:radial-gradient(ellipse at 50% 80%,#edf0e4,transparent 65%)}.stage iframe{border:0;width:750px;height:440px;flex:none;transform:scale(.75);transform-origin:center}.mini iframe{width:500px;height:190px;transform:none}.night .stage{background:#182b30}.night article{border-color:#43584f}.foot{max-width:1368px;margin:0 auto 35px;font-size:12px;color:#899283;padding:0 20px}.toolbar button:focus-visible,a:focus-visible{outline:2px solid #a67b38;outline-offset:3px}@media(max-width:700px){main{grid-template-columns:minmax(0,1fr)}.stage iframe{transform:scale(.46)}.stage{height:240px}header{padding:25px 20px 12px}h1{font-size:27px}.toolbar{padding:12px 20px}main{padding:10px 20px}.toolbar span{display:none}.account{gap:8px;flex-wrap:wrap}}
</style></head><body><header><small>EM USE / DONGDONG MESSAGES</small><h1>每一封来信，都有自己的送信人。</h1><p>11 个形象 · 小道具提醒、短气泡、展开卡片与收起后的入口。</p><div class="account"><span>额度账户 <b>用户 B · 手动登录</b></span><span>消息来源 <b>用户 A · 本机咚咚</b></span></div></header><div class="toolbar"><button class="primary" id="replay">再来一条消息</button><button id="privacy">隐藏消息正文</button><button id="theme">看看夜间</button><select id="size" aria-label="预览尺寸"><option value="440">标准 · 440</option><option value="190">迷你 · 190</option></select><span>演示数据 · 本页不接收真实消息</span></div><main></main><p class="foot">气泡 5 秒收起；悬停暂停。点击道具打开小卡片，点击“打开咚咚”在本页仅模拟操作。角色换装和真实额度保持原有逻辑。</p><script type="module">
import { SCENE_LABELS } from '/src/shared/types.ts'
let night=false,preview=true,serial=1
const main=document.querySelector('main'),size=document.querySelector('#size')
function render(){main.innerHTML='';for(const [scene,label] of Object.entries(SCENE_LABELS)){const card=document.createElement('article');card.innerHTML=`<div class="caption"><b>${label}</b><a href="/tests/fixtures/desktop.html?scene=${scene}&canvas=wide&messages=1&motion=off&random=off" target="_blank">单独预览 ↗</a></div><div class="stage ${size.value==='190'?'mini':''}"><iframe title="${label}的消息提醒" src="/tests/fixtures/desktop.html?scene=${scene}&canvas=wide&messages=1&width=${size.value}&theme=${night?'night':'day'}&motion=off&random=off"></iframe></div>`;card.querySelector('iframe').addEventListener('load',()=>{card.querySelector('iframe').contentWindow.emUse?.settings({messagePreview:preview})});main.append(card)}}
function each(fn){for(const f of document.querySelectorAll('iframe'))if(f.contentWindow.emUse)fn(f.contentWindow)}
document.querySelector('#replay').onclick=()=>{serial++;each(w=>{const s=w.__messageFixtureState().messages;s.items.unshift({...s.items[0],key:'gallery-'+serial,body:'新版本的页面已更新，有空帮我看一下吧。',at:Date.now(),fresh:true});s.items=s.items.slice(0,10);s.newCount=s.items.filter(i=>i.fresh).length;s.revision++;w.__setMessages(s)})}
document.querySelector('#privacy').onclick=e=>{preview=!preview;e.target.textContent=preview?'隐藏消息正文':'显示消息正文';each(w=>w.emUse.settings({messagePreview:preview}))}
document.querySelector('#theme').onclick=e=>{night=!night;document.body.classList.toggle('night',night);e.target.textContent=night?'回到白天':'看看夜间';each(w=>w.emUse.settings({theme:night?'night':'day'}))}
size.onchange=render;render()
</script></body></html>
