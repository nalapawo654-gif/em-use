<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><title>寄居蟹窗口与动作检查</title><style>body{font:14px system-ui;background:#eee9e0;color:#50382b;margin:24px}h1{font-size:20px}nav{display:flex;flex-wrap:wrap;gap:8px;max-width:1000px;margin:12px 0}button,select{padding:8px;border:1px solid #cdbda5;border-radius:5px;background:#fffcf6;color:inherit;cursor:pointer}iframe{display:block;width:440px;height:440px;border:1px dashed #c5bda8;margin-top:18px;background:transparent}small{color:#806d57}</style></head><body><h1>纸箱寄居蟹 · 窗口与动作检查</h1><small>仅浏览器模拟桥接，不调用原生窗口或真实账户</small><nav id="sizes"><button data-size="440">标准 440</button><button data-size="300">紧凑 300</button><button data-size="190">迷你 190</button></nav><nav><button id="normal">日常来源</button><button id="awake">Codex 觉醒</button><button id="day">白天</button><button id="night">夜晚</button><button id="full">完整动效</button><button id="light">轻柔动效</button><button id="off">关闭动效</button></nav><nav><button data-percent="100">额度 100%</button><button data-percent="60">额度 60%</button><button data-percent="30">额度 30%</button><button data-percent="0">额度 0%</button><button id="unknown">额度未知</button><button id="stale">数据过期</button><button id="weekly">只返回周额度</button></nav><nav><button data-skin="box">纸箱小窝</button><button data-skin="soda">汽水公寓</button><button data-skin="castle">城堡豪宅</button></nav><iframe id="pet" title="寄居蟹桌面窗口模拟" src="./hermit-native.html?view=widget"></iframe><script>
const pet=document.querySelector('#pet'); const send=data=>pet.contentWindow.postMessage({type:'hermit-fixture',...data},location.origin);
document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{pet.style.width=pet.style.height=b.dataset.size+'px';send({settings:{windowWidth:Number(b.dataset.size)}})});
document.querySelectorAll('[data-percent]').forEach(b=>b.onclick=()=>send({percent:Number(b.dataset.percent)}));
document.querySelectorAll('[data-skin]').forEach(b=>b.onclick=()=>send({settings:{hermitSkin:b.dataset.skin}}));
document.querySelector('#normal').onclick=()=>send({settings:{quotaSource:'eastmoney'}});document.querySelector('#awake').onclick=()=>send({settings:{quotaSource:'codex',codexEnabled:true}});
for(const theme of ['day','night']) document.querySelector('#'+theme).onclick=()=>send({settings:{theme}});
for(const evolutionMotion of ['full','light','off']) document.querySelector('#'+evolutionMotion).onclick=()=>send({settings:{evolutionMotion}});
document.querySelector('#unknown').onclick=()=>send({percent:null});document.querySelector('#stale').onclick=()=>send({stale:true});document.querySelector('#weekly').onclick=()=>send({weeklyOnly:true});
</script></body></html>
