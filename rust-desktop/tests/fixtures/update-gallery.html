<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>十一位伙伴的更新来信 · EM Use</title><style>
:root{font-family:'PingFang SC','Microsoft YaHei',sans-serif;color:#344840;background:#f4f1e8}*{box-sizing:border-box}body{margin:0}main{max-width:1510px;margin:auto;padding:45px 32px}header{display:flex;align-items:end;justify-content:space-between;gap:24px;border-bottom:1px solid #d4d9c9;padding-bottom:25px}small{font-size:11px;letter-spacing:2px;color:#7a8771}h1{font:600 34px 'Songti SC',serif;margin:12px 0}header p{font-size:13px;color:#75806d;line-height:1.8;margin:0}.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px}select,button{padding:9px 11px;border:1px solid #c7d1bc;border-radius:6px;background:#fbfaf4;color:#496145;font:inherit;cursor:pointer}.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,450px),1fr));gap:24px;margin-top:30px}article{border:1px solid #d8ddcd;border-radius:18px;background:#eeeee1;overflow:hidden}.caption{padding:19px 22px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #dce0d0}.caption b{font:600 18px 'Songti SC',serif}.caption span{font-size:11px;color:#7f8b72}.frame{display:flex;justify-content:center;align-items:center;padding:12px;min-height:464px;background:radial-gradient(ellipse at 50% 80%,#dce5d380,transparent 70%)}iframe{width:440px;height:440px;border:0;max-width:100%;background:transparent;display:block}.night .frame{background:#243234}.night article{border-color:#81948a}.gallery-note{font-size:12px;line-height:1.8;color:#687764;margin-top:28px}a{color:#3f6752}button:focus-visible,select:focus-visible{outline:2px solid #b98646;outline-offset:3px}@media(max-width:600px){main{padding:25px 12px}header{display:block}h1{font-size:28px}.controls{margin-top:20px}.frame{padding:0;min-height:320px}.gallery{grid-template-columns:1fr}.caption{padding:15px}iframe{width:100%;aspect-ratio:1;height:auto}}
</style></head><body><main><header><div><small>A LETTER FROM YOUR LITTLE COMPANION</small><h1>十一位伙伴，十一封新来信。</h1><p>点击角色旁的「新版本」，拆开它送来的更新消息。<br>这里使用演示版本与模拟进度，按钮不会下载安装包或重启应用。</p></div><div class="controls"><label>窗口 <select id="size"><option value="440">标准 440</option><option value="300">紧凑 300</option><option value="190">迷你 190</option><option value="180">最小 180</option></select></label><label>光线 <select id="theme"><option value="day">白天</option><option value="night">夜晚</option></select></label><label>动效 <select id="motion"><option value="off">轻柔模式</option><option value="on">来信动效</option></select></label><button id="reset">重新收到来信</button></div></header><div class="gallery" id="gallery"></div><p class="gallery-note">每份来信共用检查、稍后、下载、错误与重启流程。正在互动时来信让位；同一版本的「稍后」由正式客户端统一保存。此展板重新载入时会重置演示提醒，方便比较设计。</p></main><script>
const pets=[['aquarium','额度小鱼缸','漂流瓶'],['buddy','充气牛马','打气邮包'],['beaver','林间海狸鼠','树叶信'],['hamster','仓鼠动力机房','齿轮工单'],['cultivation','修仙渡劫事务所','传音符'],['battery','健身电池人','能量芯片'],['feidudu','肥嘟嘟','奶茶来信'],['fox','水墨小狐','墨尾信笺'],['luckycat','破产招财猫','金铃福签'],['dinosaur','摸鱼小恐龙','小翼信封'],['skadi','斯卡蒂 · 月汐','月光封蜡信']];
function render(){const width=Number(document.querySelector('#size').value),theme=document.querySelector('#theme').value,motion=document.querySelector('#motion').value;document.body.classList.toggle('night',theme==='night');document.querySelector('#gallery').replaceChildren(...pets.map(([scene,name,object],i)=>{const article=document.createElement('article'),caption=document.createElement('div'),frame=document.createElement('div'),iframe=document.createElement('iframe');caption.className='caption';const title=document.createElement('b'),label=document.createElement('span');title.textContent=name;label.textContent=String(i+1).padStart(2,'0')+' / '+object;caption.append(title,label);frame.className='frame';iframe.title=name+'更新来信';iframe.src=`desktop.html?scene=${scene}&update=available&fresh=1&random=off&motion=${motion}&theme=${theme}&width=${width}`;iframe.width=width;iframe.height=width;iframe.style.width=width+'px';iframe.style.height=width+'px';frame.append(iframe);article.append(caption,frame);return article}));}for(const el of document.querySelectorAll('select'))el.addEventListener('change',render);document.querySelector('#reset').addEventListener('click',render);render();
</script></body></html>
