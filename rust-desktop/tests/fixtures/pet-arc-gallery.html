<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>EM Use · 环抱操作带</title><style>
*{box-sizing:border-box}body{margin:0;background:#eeeee6;color:#404b3c;font:14px system-ui}header{padding:24px 32px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;background:#fafaf3;position:sticky;top:0;z-index:2;border-bottom:1px solid #d8ddcf}h1{font-size:21px;margin:0 15px 0 0}label{display:flex;align-items:center;gap:6px}select,button{font:inherit;padding:7px 10px;border:1px solid #ced5c4;border-radius:7px;background:#fff;color:#404b3c}main{padding:22px;display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:18px}article{border:1px solid #d4d9cb;border-radius:18px;padding:15px;background:#f4f5ed;overflow:hidden}h2{font-size:14px;margin:0 0 12px;font-weight:500;color:#687260}.stage{position:relative;margin:auto;width:280px;height:280px}iframe{border:0;transform-origin:top left;background:transparent}body.night{background:#151e22;color:#e0e6d9}body.night header{background:#202a2e;border-color:#3c4646}body.night article{background:#273236;border-color:#3d4945}body.night h2{color:#c0cfc2}p{margin:0 32px 25px;color:#788371;font-size:12px}
</style></head><body><header><h1>环抱操作带 · 13 位伙伴</h1><label>尺寸<select id="size"><option value="440">标准 · 440</option><option value="300">紧凑 · 300</option><option value="190">迷你 · 190</option><option value="180">最小 · 180</option><option value="800">最大 · 800</option></select></label><label>主题<select id="theme"><option value="day">白天</option><option value="night">夜晚</option></select></label><label>额度<select id="quota"><option value="68">演示 · 68%</option><option value="100">演示 · 100%</option><option value="0">演示 · 0%</option><option value="none">未连接</option></select></label><label><input id="expanded" type="checkbox" checked>展开操作</label></header><main></main><p>浏览器组件预览 · 使用演示数据。原生透明窗口、系统拖动和真实账户另行验收。</p><script type="module">
const pets={aquarium:'额度小鱼缸',buddy:'充气牛马',beaver:'林间海狸鼠',hamster:'仓鼠动力机房',cultivation:'修仙渡劫事务所',battery:'健身电池人',feidudu:'肥嘟嘟',fox:'水墨小狐',luckycat:'破产招财猫',dinosaur:'小恐龙',skadi:'月汐',piranha:'捕需求草',potato:'土豆战神'};
function render(){const width=Number(size.value);document.body.classList.toggle('night',theme.value==='night');document.querySelector('main').replaceChildren(...Object.entries(pets).map(([scene,name])=>{const a=document.createElement('article');a.innerHTML=`<h2>${name}</h2><div class="stage"><iframe title="${name}" width="${width}" height="${width}" style="transform:scale(${280/width})" src="/tests/fixtures/desktop.html?scene=${scene}&width=${width}&theme=${theme.value}&${quota.value==='none'?'quota=none':'percent='+quota.value}&motion=off&arcPreview=${expanded.checked?'on':'off'}"></iframe></div>`;return a}));}
const size=document.querySelector('#size'),theme=document.querySelector('#theme'),quota=document.querySelector('#quota'),expanded=document.querySelector('#expanded');[size,theme,quota,expanded].forEach(el=>el.addEventListener('change',render));render();
</script></body></html>
