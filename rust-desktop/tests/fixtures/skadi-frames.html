<!doctype html><html lang="zh-CN"><meta charset="utf-8"><base href="/"><link rel="icon" href="data:,"><title>月汐全部显示帧</title><style>body{margin:0;background:#101b2d;color:#dce6f4;font:14px system-ui;padding:24px}h1{font:24px serif}.row{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:24px}.cell{position:relative;border:1px solid #53677e88;background:linear-gradient(135deg,#20334a,#101b2d);aspect-ratio:1}.cell>small{position:absolute;bottom:1px;left:10px;font:10px monospace}.light{background:#e3eaf3} .visual{position:absolute;inset:0}.cats{max-width:1000px}</style><div id="app"></div><script type="module">
import {createApp,h} from '/node_modules/.vite/deps/vue.js'
import SkadiVisual from '/src/components/SkadiVisual.vue'
import {loadSkadiCat} from '/src/skadi/sprites.ts'
import '/src/skadi.css'
const cats=await loadSkadiCat()
createApp({render(){return h('main',[
 h('h1','月汐 / 18 张角色姿态 + 6 张夜影姿态 · 实际运行时解码'),
 ...['classic','moonlight','pajamas'].map(skin=>h('section',[h('h2',skin),h('div',{class:'row'},Array.from({length:6},(_,i)=>h('div',{class:['cell',i%2?'light':'']},[h(SkadiVisual,{skin,sampleFrame:i,gentle:true,paused:true}),h('small',String(i))])))])),
 h('div',{class:'row cats'},cats.map((src,i)=>h('div',{class:['cell',i%2?'light':'']},[h('img',{src,style:'width:100%;height:100%;object-fit:contain'}),h('small','cat '+i)])))
])}}).mount('#app')
</script></html>
