[package]
name = "em-use-collaboration-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
publish = false
description = "EM Use 多人 Agent 协作 · 自建协作服务（第一版骨架，仅身份/房间/消息/任务/成果，不含任何 Agent 执行适配）"

[[bin]]
name = "em-use-collab-server"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
axum = { version = "0.7", features = ["json"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.7", default-features = false, features = ["runtime-tokio-rustls", "postgres", "macros", "migrate", "uuid", "chrono", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
thiserror = "1"
anyhow = "1"
dotenvy = "0.15"
base64 = "0.22"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.4", features = ["util"] }
